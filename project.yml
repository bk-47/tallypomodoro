# Only needed if Tally.xcodeproj ever won't open: `brew install xcodegen && xcodegen`
name: Tally
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  Tally:
    type: application
    platform: macOS
    sources: [Tally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krny.tally
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: tally
        PRODUCT_NAME: tally
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
